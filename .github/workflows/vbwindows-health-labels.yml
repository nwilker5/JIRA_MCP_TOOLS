name: VBWindows health status sync

on:
  schedule:
    # Every hour, Monday–Friday (UTC). Adjust for your timezone if needed.
    - cron: "0 * * * 1-5"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate secrets
        env:
          JIRA_URL: ${{ secrets.VME_BOT_JIRA_URL }}
          JIRA_USERNAME: ${{ secrets.VME_BOT_JIRA_USERNAME }}
          JIRA_API_TOKEN: ${{ secrets.VME_BOT_JIRA_API_TOKEN }}
        run: |
          missing=()
          [[ -z "$JIRA_URL" ]] && missing+=("VME_BOT_JIRA_URL")
          [[ -z "$JIRA_USERNAME" ]] && missing+=("VME_BOT_JIRA_USERNAME")
          [[ -z "$JIRA_API_TOKEN" ]] && missing+=("VME_BOT_JIRA_API_TOKEN")
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::Missing repository secrets: ${missing[*]}"
            echo "Add them at: Settings → Secrets and variables → Actions"
            echo "  VME_BOT_JIRA_URL = https://redhat.atlassian.net"
            echo "  VME_BOT_JIRA_USERNAME = vme-automation-bot@redhat.com"
            echo "  VME_BOT_JIRA_API_TOKEN = <bot API token>"
            exit 1
          fi
          echo "Secrets present (values not shown)."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Sync VBWindows health status (execute)
        env:
          JIRA_URL: ${{ secrets.VME_BOT_JIRA_URL }}
          JIRA_USERNAME: ${{ secrets.VME_BOT_JIRA_USERNAME }}
          JIRA_API_TOKEN: ${{ secrets.VME_BOT_JIRA_API_TOKEN }}
        run: |
          python3 .cursor/skills/vbwindows-health-labels/scripts/vbwindows_health_labels.py --execute

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vbwindows-health-labels-log
          path: vbwindows_health_labels.log
          if-no-files-found: ignore
