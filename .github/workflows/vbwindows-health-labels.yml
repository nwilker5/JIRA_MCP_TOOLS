name: VBWindows health status sync

on:
  schedule:
    # Every hour, Monday–Friday (UTC). Adjust for your timezone if needed.
    - cron: "0 * * * 1-5"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      JIRA_URL: ${{ secrets.VME_BOT_JIRA_URL }}
      JIRA_USERNAME: ${{ secrets.VME_BOT_JIRA_USERNAME }}
      JIRA_API_TOKEN: ${{ secrets.VME_BOT_JIRA_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Sync VBWindows health status (execute)
        run: |
          python3 .cursor/skills/vbwindows-health-labels/scripts/vbwindows_health_labels.py --execute

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vbwindows-health-labels-log
          path: vbwindows_health_labels.log
          if-no-files-found: ignore
